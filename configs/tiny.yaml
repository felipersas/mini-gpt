data:
  # 4 romances de Machado de Assis (scripts/prepare_corpus.py) + um recorte de ~15M caracteres
  # da Wikipedia em português (scripts/prepare_wikipedia_corpus.py), ~16,7M caracteres no total.
  corpus_path: corpus/machado_e_wikipedia.txt
  val_fraction: 0.1
  stride: 128
  # Alvo do BPE: especiais + alfabeto do corpus + merges (docs/18-bpe-tokenizer.md). O alfabeto
  # cresceu bastante com a Wikipedia; compressão e cobertura de context_length precisam ser
  # remedidas depois do próximo treino, os números antigos eram do corpus só de literatura.
  vocab_size: 4096

model:
  context_length: 128
  d_model: 256
  num_heads: 4
  num_layers: 8
  # 0.1 dava overfitting mais forte (gap validação-treino +0.35, melhor val 1.427); 0.2 reduz o
  # gap pra +0.26 e leva a melhor validação a 1.396.
  dropout: 0.2
  tie_weights: true

training:
  batch_size: 30
  # Em decimal: o PyYAML lê "1e-3" como string.
  learning_rate: 0.001
  # Igual ao máximo: lr constante depois do warmup. Na comparação em docs/11-training.md, decair
  # cedo atrasou o treino.
  min_learning_rate: 0.001
  warmup_steps: 100
  # Corpus ~10x maior desde a Wikipedia: cada época já cobre bem mais tokens únicos, então
  # menos épocas bastam. 15 fica perto da razão tokens/parâmetro do Chinchilla (docs/02-dataset.md).
  epochs: 15
  weight_decay: 0.01
  gradient_clip: 1.0
  seed: 42
  log_every: 100
  # Além do latest.pt, salvo ao fim de toda época.
  checkpoint_every: 1000
